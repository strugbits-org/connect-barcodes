name: ConnectBarcodes CI

# Pre-merge safety net: type-check the backend and type-check + build the
# frontend. Deployment is handled by Vercel's and Railway's native Git
# integrations (not this workflow), so there are no deploy jobs here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ────── Backend: Type-check ──────────────────────────────────────────────────
  backend-check:
    name: Backend – TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Single root lockfile — this is an npm workspaces monorepo.
          cache-dependency-path: package-lock.json

      # Install the whole workspace from the root lockfile.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Non-blocking: Medusa's generated types can trip standalone tsc, and the
      # backend is deployed via `medusa build` on Railway. We surface type
      # output without failing the gate.
      - name: Type check
        run: npx tsc --noEmit || true
        working-directory: backend

  # ────── Frontend: Type-check & Build ─────────────────────────────────────────
  frontend-check:
    name: Frontend – TypeScript & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: connect_barcodes_products
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Real gates: both must pass for the check to be green.
      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
